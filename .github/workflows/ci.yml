name: CI Pipeline

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # FastAPI serving layer: lint, unit tests, image build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install black==24.4.2 flake8==7.0.0 pytest httpx
          pip install -r api/requirements.txt

      - name: Lint and format check
        run: |
          flake8 api/ --max-line-length=120 --ignore=E501,W503
          black --check api/

      - name: Unit tests
        working-directory: api
        env:
          PYTHONPATH: .
        run: pytest -q tests/

      - name: Build API image
        run: docker build -t geoplatform-api:ci ./api

  frontend:
    # React SPA: lint, production build, nginx image build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Build frontend image
        run: docker build -t geoplatform-frontend:ci .

  streaming:
    # Redpanda producers + PyFlink job, and the compose contract for every profile.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres
      AIRFLOW_DB_PASSWORD: ci-airflow
      AIRFLOW_FERNET_KEY: ci-placeholder-fernet-key-not-used-at-build
      AIRFLOW_ADMIN_PASSWORD: ci-admin
      AIRFLOW_SECRET_KEY: ci-webserver-secret
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-minio-secret
      JWT_SECRET: ci-jwt-secret
      GF_SECURITY_ADMIN_PASSWORD: ci-grafana
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt flake8

      - name: Lint producers and Flink job
        run: flake8 redpanda/ flink/jobs/ tests/ --max-line-length=130 --ignore=E501,W503,E701,E704,E731

      - name: Unit tests (producers, stream logic, compose/schema contracts)
        run: python -m pytest -q tests/

      - name: Validate docker-compose (all profiles)
        run: docker compose --profile weather --profile sensor --profile monitoring config --quiet

      - name: Build producer images
        run: |
          docker build -t geoplatform-sensor-producer:ci redpanda/producer
          docker build -t geoplatform-weather-producer:ci redpanda/weather_producer

      - name: Build Flink image (compiles connector and builds the job graph)
        run: docker build -t geoplatform-flink:ci flink

  batch-and-transform:
    # Applies the real schema and runs dbt against it, so a column mismatch between
    # models and tables fails here. `dbt compile` alone cannot catch that.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: geoplatform
      POSTGRES_USER: geoplatform
      POSTGRES_PASSWORD: ci-postgres
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geoplatform
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: geoplatform
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install black==24.4.2 flake8==7.0.0 dbt-core==1.11.17 dbt-postgres==1.11.0

      - name: Lint DAGs and Iceberg loader
        run: |
          flake8 dags/ iceberg/ --max-line-length=120 --ignore=E501,W503
          black --check dags/ iceberg/

      - name: Apply database schema
        env:
          PGPASSWORD: ci-postgres
        run: psql -h localhost -U geoplatform -d geoplatform -v ON_ERROR_STOP=1 -f scripts/init_postgis.sql

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .

  terraform:
    # Formatting and static validation only; no AWS credentials, no backend.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
