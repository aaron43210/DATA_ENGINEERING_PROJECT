global:
  scrape_interval: 15s

scrape_configs:
  # The API runs on ECS; Cloud Map keeps this name pointed at the current task.
  - job_name: geoplatform_api
    dns_sd_configs:
      - names: ["api.geoplatform.internal"]
        type: A
        port: 8000

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
