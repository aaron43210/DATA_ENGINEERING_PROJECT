name: satellite_checkpoint
config_version: 1.0
class_name: Checkpoint
run_name_template: "%Y%m%d-%H%M%S-satellite"
validations:
  - batch_request:
      datasource_name: geoplatform_pg
      data_connector_name: marts_connector
      data_asset_name: satellite_observation
    expectation_suite_name: satellite_suite
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
