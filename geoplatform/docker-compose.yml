x-airflow-common: &airflow-common
  build: ./airflow
  image: geoplatform-airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # OpenLineage — emit lineage to DataHub
    AIRFLOW__LINEAGE__BACKEND: openlineage.airflow.backend.OpenLineageBackend
    OPENLINEAGE_URL: http://datahub-gms:8080
    OPENLINEAGE_NAMESPACE: geoplatform.airflow
    # Service connectivity
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
    LAKEFS_ENDPOINT: http://lakefs:8000
    LAKEFS_ACCESS_KEY: ${LAKEFS_ACCESS_KEY:?set in .env}
    LAKEFS_SECRET_KEY: ${LAKEFS_SECRET_KEY:?set in .env}
    POSTGRES_HOST: postgres
    POSTGRES_DB: geoplatform
    POSTGRES_USER: geoplatform
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    REDPANDA_BROKERS: redpanda:9092
    MONGO_URI: mongodb://${MONGO_ROOT_USER:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?set in .env}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./openlineage/config:/opt/airflow/openlineage
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── Core Databases ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geoplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: geoplatform
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init_db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "geoplatform"]
      interval: 10s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
    volumes:
      - mongo_data:/data/db

  # ── Object Storage (MinIO + LakeFS) ─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?set in .env} ${MINIO_ROOT_PASSWORD:?set in .env};
      mc mb local/geoplatform-bronze --ignore-existing;
      mc mb local/geoplatform-silver --ignore-existing;
      mc mb local/geoplatform-gold --ignore-existing;
      mc mb local/lakefs-data --ignore-existing;
      exit 0;
      "

  lakefs:
    image: treeverse/lakefs:latest
    ports:
      - "8000:8000"
    environment:
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY:?set in .env}
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      LAKEFS_INSTALLATION_USER_NAME: admin
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY:?set in .env}
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_KEY:?set in .env}
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - lakefs_data:/home/lakefs

  # ── Iceberg REST Catalog ─────────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:0.10.0
    ports:
      - "8182:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://geoplatform-silver/iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # ── Redpanda (Kafka-compatible, no Zookeeper) ────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9093
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9093
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    ports:
      - "9093:9093"    # external Kafka
      - "8081:8081"    # Schema Registry (built-in to Redpanda)
      - "8082:8082"    # Pandaproxy (HTTP REST for Kafka)
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      retries: 10

  redpanda-console:
    image: redpandadata/console:latest
    ports:
      - "8088:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./redpanda/console-config.yml:/tmp/config.yml
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Flink ────────────────────────────────────────────────────────
  flink-jobmanager:
    build: ./flink
    image: geoplatform-flink
    command: jobmanager
    ports:
      - "8083:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      REDPANDA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      POSTGRES_HOST: postgres
      POSTGRES_DB: geoplatform
      POSTGRES_USER: geoplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./flink/jobs:/opt/flink/jobs

  flink-taskmanager:
    build: ./flink
    image: geoplatform-flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      REDPANDA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      POSTGRES_HOST: postgres
      POSTGRES_DB: geoplatform
      POSTGRES_USER: geoplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    depends_on:
      - flink-jobmanager
    volumes:
      - ./flink/jobs:/opt/flink/jobs

  # ── Airflow ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
          --firstname Admin --lastname User
          --role Admin --email admin@example.com
      "

  # ── DataHub (Metadata Catalog + Lineage UI) ──────────────────────
  datahub-quickstart:
    image: linkedin/datahub-quickstart:head
    ports:
      - "9002:9002"    # DataHub frontend UI
    volumes:
      - datahub_data:/var/datahub
    environment:
      DATAHUB_SECRET: ${DATAHUB_SECRET:?set in .env}
    networks:
      default:
        aliases:
          # OpenLineage producers (Airflow, Flink) POST to http://datahub-gms:8080.
          # The quickstart container serves GMS on 8080; this alias makes that
          # hostname resolve to it on the compose network.
          - datahub-gms

  # ── FastAPI + GraphQL ────────────────────────────────────────────
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://geoplatform:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/geoplatform
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      BUCKET_BRONZE: geoplatform-bronze
      BUCKET_SILVER: geoplatform-silver
      LAKEFS_ENDPOINT: http://lakefs:8000
      LAKEFS_ACCESS_KEY: ${LAKEFS_ACCESS_KEY:?set in .env}
      LAKEFS_SECRET_KEY: ${LAKEFS_SECRET_KEY:?set in .env}
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MONGO_URI: mongodb://${MONGO_ROOT_USER:?set in .env}:${MONGO_ROOT_PASSWORD:?set in .env}@mongodb:27017
      REDPANDA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      API_KEY: ${API_KEY:?set in .env}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Sensor Producer ──────────────────────────────────────────────
  sensor-producer:
    build:
      context: ./redpanda/producer
    environment:
      REDPANDA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Weather Streaming Producer ───────────────────────────────────
  weather-producer:
    build:
      context: ./redpanda/weather_producer
    environment:
      REDPANDA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?set in .env}
      POLL_INTERVAL_SECONDS: "60"
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Monitoring ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_ALERTING_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  lakefs_data:
  airflow_logs:
  redpanda_data:
  prometheus_data:
  grafana_data:
  datahub_data:
