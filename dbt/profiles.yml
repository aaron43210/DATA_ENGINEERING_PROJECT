geoplatform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'geoplatform') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'geoplatform') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'geoplatform') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'geoplatform') }}"
      schema: public
      threads: 8
      keepalives_idle: 0
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"
